[project]
name = "mpu-drug-solubility"
version = "0.1.0"
description = "Reproducible grouped molecular solubility experiments and Chinese demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.7,<2",
  "rdkit==2026.9.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "joblib>=1.4",
  "torch>=2.5",
  "tabm",
  "pytabkit",
  "streamlit>=1.40",
  "pytest>=8",
  "shap>=0.46",
  "statsmodels>=0.14",
  "pymupdf>=1.25",
  "pypdf>=5",
  "fastapi>=0.163.1",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
  "tabpfn==6.4.1",
  "catboost==1.2.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
