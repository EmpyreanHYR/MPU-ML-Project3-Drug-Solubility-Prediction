name: Publish HTML presentation

on:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      # presentation/tools/build_chart_data.py reads these, so a data change can
      # change the published charts even when presentation/ itself is untouched.
      - 'output/**'
      - 'datasets/**'
      - '.github/workflows/publish-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt.outputs.page_url || steps.deployment.outputs.page_url }}presentation/
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: presentation
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Collect presentation files
        run: |
          mkdir -p _site/presentation
          cp presentation/index.html _site/presentation/
          cp -R presentation/assets presentation/css presentation/js presentation/notes _site/presentation/
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          name: github-pages
          path: _site
      - name: Verify Pages upload
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID" || { echo "::error::Pages upload returned no artifact ID"; exit 1; }
      - name: Deploy presentation
        id: deployment_attempt
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      # Two failure modes are seen in practice: the artifact listing briefly lags
      # behind a successful upload, and the deployment API itself returns 5xx
      # during a Pages incident. Both clear within a few minutes, so the three
      # retries are spaced 30 s, 60 s and 120 s; a fourth failure still fails
      # the workflow.
      - name: Wait before retrying Pages deployment
        if: ${{ !cancelled() && steps.deployment_attempt.outcome == 'failure' }}
        run: sleep 30
      - name: Retry presentation deployment (1)
        if: ${{ !cancelled() && steps.deployment_attempt.outcome == 'failure' }}
        id: deployment_retry_1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Wait before retrying Pages deployment again
        if: ${{ !cancelled() && steps.deployment_retry_1.outcome == 'failure' }}
        run: sleep 60
      - name: Retry presentation deployment (2)
        if: ${{ !cancelled() && steps.deployment_retry_1.outcome == 'failure' }}
        id: deployment_retry_2
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Wait before the last Pages deployment attempt
        if: ${{ !cancelled() && steps.deployment_retry_2.outcome == 'failure' }}
        run: sleep 120
      - name: Retry presentation deployment (3)
        if: ${{ !cancelled() && steps.deployment_retry_1.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure' }}
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
