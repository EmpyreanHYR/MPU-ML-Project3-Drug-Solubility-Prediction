name: Publish HTML presentation

on:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - '.github/workflows/publish-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt.outputs.page_url || steps.deployment.outputs.page_url }}presentation/
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: presentation
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Collect presentation files
        run: |
          mkdir -p _site/presentation
          cp presentation/index.html _site/presentation/
          cp -R presentation/assets presentation/css presentation/js presentation/notes _site/presentation/
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          name: github-pages
          path: _site
      - name: Verify Pages upload
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID" || { echo "::error::Pages upload returned no artifact ID"; exit 1; }
      - name: Deploy presentation
        id: deployment_attempt
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      # Artifact listing can briefly lag behind a successful upload finalization.
      # Retry once; a second failure must still fail the workflow.
      - name: Wait before retrying Pages deployment
        if: ${{ !cancelled() && steps.deployment_attempt.outcome == 'failure' }}
        run: sleep 15
      - name: Retry presentation deployment
        if: ${{ !cancelled() && steps.deployment_attempt.outcome == 'failure' }}
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
