<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOLAR 中文演讲备注</title>
  <style>
    :root { color-scheme: dark; font: 20px/1.65 "Microsoft YaHei", "Segoe UI", sans-serif; background: #081426; color: #f1f5f9; }
    body { margin: 0 auto; max-width: 44rem; padding: 2rem 1.4rem; }
    h1 { font-size: 1.55rem; line-height: 1.2; margin: .6rem 0; }
    #position, #duration { color: #61dcca; }

  </style>
  <script src="presenter.js" defer></script>

  <p id="position">正在连接汇报页面</p>
  <h1 id="title">中文演讲备注</h1>

  <p id="notes" aria-live="polite">从汇报页面按 N 打开此窗口。</p>
  <p id="hint">投影时只共享汇报标签页。切回汇报标签页使用键盘翻页。</p>

</html>
